# Ships the website and the Mac app. See desktop/README.md, "Releasing".
#
# - Website: deploys to Cloudflare on push to main, but only while the repository variable
#   AUTO_DEPLOY_WEB is "true". Otherwise run it by hand (Actions > Release > Run workflow).
# - Mac app: builds, signs, notarizes and publishes on a desktop-vX.Y.Z tag, or by hand.
# - Run by hand with publish unchecked for a dry run: everything builds, nothing is deployed or released
#   (the desktop artifacts are uploaded to the run instead).
name: Release

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to ship
        type: choice
        options: [web, desktop, both]
        default: both
      publish:
        description: Deploy / publish (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_WEB == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: bun run build
      - name: Build and deploy
        if: github.event_name == 'push' || inputs.publish
        run: bun run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  desktop:
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'web')
    runs-on: macos-14
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile

      - name: Check the version
        id: version
        run: |
          VERSION=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          [ "$VERSION" = "$CARGO" ] || { echo "tauri.conf.json is $VERSION but Cargo.toml is $CARGO"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "desktop-v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1
          fi
          if [ "$PUBLISH" = "true" ] && gh release view "desktop-v$VERSION" >/dev/null 2>&1; then
            echo "desktop-v$VERSION is already released; bump the version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import the Developer ID certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Signs with signingIdentity from tauri.conf.json. Apple credentials are left out here on purpose so
      # tauri doesn't notarize; the next step does, as in the manual release.
      - name: Build
        run: bun run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Notarize, staple, repack and sign the update
        run: |
          BUNDLE=desktop/src-tauri/target/release/bundle
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          APP="$BUNDLE/macos/Formal Mind.app"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"

          mkdir -p out
          cp "$DMG" out/Formal-Mind-mac.dmg
          tar -czf out/Formal-Mind-mac.app.tar.gz -C "$BUNDLE/macos" "Formal Mind.app"
          bunx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" out/Formal-Mind-mac.app.tar.gz

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Formal Mind $VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat out/Formal-Mind-mac.app.tar.gz.sig)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-v$VERSION/Formal-Mind-mac.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' > out/latest.json
          cat out/latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: WA3Q5YSLK6
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Keep the dry run's files
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formal-mind-mac-${{ steps.version.outputs.version }}
          path: out/

      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: |
          gh release create "desktop-v$VERSION" --title "Formal Mind $VERSION" --notes "Formal Mind $VERSION" \
            --target "$GITHUB_SHA" \
            out/Formal-Mind-mac.dmg out/Formal-Mind-mac.app.tar.gz out/latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
