<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" />
		<title>Formal Mind</title>
		<meta name="description" content="A swarm of agents for verifying Ethereum smart contracts." />
		<!-- Agent discovery: the same entry points the Link response header names (worker/discovery.ts). -->
		<link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
		<link rel="api-catalog" href="/.well-known/api-catalog" />
		<link rel="ai-catalog" href="/.well-known/ai-catalog.json" />
		<link rel="alternate" type="application/mcp-server-card+json" href="/.well-known/mcp/server-card.json" />
		<!-- The theme before the first paint, so dark mode doesn't flash white while the app loads. -->
		<script>
			try {
				var t = localStorage.getItem("formal-mind-theme") || "system";
				if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
					document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = "dark";
				}
			} catch (e) {}
		</script>
	</head>
	<body class="antialiased">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
