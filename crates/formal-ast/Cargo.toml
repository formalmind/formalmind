[package]
name = "formal-ast"
version = "0.1.0"
edition = "2021"
description = "Reads a Solidity protocol through solc's AST: the contract graph, its scope, units of work and slices for agents"
license = "MIT"
repository = "https://github.com/formalmind/formalmind"
homepage = "https://formal.team"
keywords = ["solidity", "solc", "ast", "audit"]
categories = ["development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[[bin]]
name = "formal-ast"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
