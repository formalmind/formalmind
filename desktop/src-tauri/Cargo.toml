[package]
name = "formalmind-desktop"
version = "0.2.26"
description = "Formal Mind desktop app"
edition = "2021"

[lib]
name = "formalmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "1.1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
formal-ast = { path = "../../crates/formal-ast" }
regex = "1"
# The agents' file search: an index per folder, kept current by a watcher.
fff-search = "=0.11.0"
# A file write's diff for the chat.
similar = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }
# The swarm's tools over MCP for Claude Code (127.0.0.1, one turn).
tiny_http = "0.12"
portable-pty = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# formal-ast reads big solc ASTs; unoptimized, it's too slow for `tauri dev`.
[profile.dev.package.formal-ast]
opt-level = 3
