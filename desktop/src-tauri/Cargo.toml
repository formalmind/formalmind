[package]
name = "formalmind-desktop"
version = "0.2.2"
description = "Formal Mind desktop app"
edition = "2021"

[lib]
name = "formalmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sol-debug = { path = "../../crates/sol-debug" }
formal-ast = { path = "../../crates/formal-ast" }
# The agents' coverage and explore tools. It depends on sol-debug and formal-ast from this repository on GitHub; the
# [patch] below points those at the crates here, so there is one sol-debug.
concolity = { git = "https://github.com/formalmind/concolity" }
revm = { version = "43", default-features = false, features = ["std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }
# The swarm's and the Bug Hunter's tools over MCP for Claude Code (127.0.0.1, one turn).
tiny_http = "0.12"
portable-pty = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Debug mode records tens of thousands of EVM steps per test; unoptimized, the engine is too slow for `tauri dev`.
[profile.dev.package.sol-debug]
opt-level = 3
[profile.dev.package.formal-ast]
opt-level = 3
[profile.dev.package.concolity]
opt-level = 3
[profile.dev.package.revm-interpreter]
opt-level = 3
[profile.dev.package.revm-handler]
opt-level = 3
[profile.dev.package.revm-context]
opt-level = 3
[profile.dev.package.revm-database]
opt-level = 3
[profile.dev.package.revm-bytecode]
opt-level = 3
[profile.dev.package.revm-primitives]
opt-level = 3
[profile.dev.package.ruint]
opt-level = 3
[profile.dev.package.alloy-primitives]
opt-level = 3

[patch."https://github.com/formalmind/formalmind"]
sol-debug = { path = "../../crates/sol-debug" }
formal-ast = { path = "../../crates/formal-ast" }
