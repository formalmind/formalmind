# Formal Mind's report theme for asciidoctor-pdf: the brand's black cover with the lockup, a running header with
# the dark-text lockup, and severity and status colours set per table cell by the report.
extends: default-sans
page:
  layout: portrait
  size: Letter
  margin: [0.95in, 0.8in, 0.8in, 0.8in]
base:
  font-size: 10
  line-height: 1.4
  font-color: #1F1F1F
heading:
  font-style: bold
  font-color: #0A0A0A
  h2-font-size: 26
  h3-font-size: 15
  h4-font-size: 12.5
  h5-font-size: 11
  margin-top: 16
  margin-bottom: 8
link:
  font-color: #0B5FFF
codespan:
  font-color: #9F1D4F
code:
  font-size: 8.5
  background-color: #F7F7F8
  border-color: #E4E4E7
  border-radius: 4
caption:
  font-size: 9
  font-color: #52525B
  font-style: normal
table:
  font-size: 9.5
  border-color: #D4D4D8
  grid-color: #D4D4D8
  cell-padding: [5, 6, 5, 6]
  head:
    background-color: #F4F4F5
    font-style: bold
  foot:
    background-color: #F4F4F5
    font-style: bold
toc:
  dot-leader-color: #A1A1AA
  h2-font-style: bold
title-page:
  align: left
  background-color: #000000
  logo:
    top: 9%
    align: left
  title:
    top: 46%
    font-size: 30
    font-color: #FFFFFF
    font-style: bold
    line-height: 1.15
  subtitle:
    font-size: 40
    font-color: #FFFFFF
    font-style: bold
    margin-top: 18
  authors:
    font-color: #A3A3A3
    font-size: 12
    margin-top: 36
  revision:
    font-color: #A3A3A3
    font-size: 10
    margin-top: 6
header:
  height: 0.75in
  vertical-align: middle
  font-size: 8.5
  font-color: #71717A
  border-color: #E4E4E7
  border-width: 0.5
  recto:
    left:
      content: image:formal-mind-lockup-dark.svg[pdfwidth=1.05in]
    right:
      content: '{document-subtitle}'
  verso:
    left:
      content: image:formal-mind-lockup-dark.svg[pdfwidth=1.05in]
    right:
      content: '{document-subtitle}'
footer:
  height: 0.55in
  font-size: 8.5
  font-color: #71717A
  recto:
    left:
      content: 'Formal Mind · Security Assessment & Formal Verification'
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
    right:
      content: 'Formal Mind · Security Assessment & Formal Verification'
