services:
  redis:
    image: redis:7-alpine
    container_name: my-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data

  webhook:
    build: .
    container_name: webhook
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      WEBHOOK_HOST: 0.0.0.0
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
